name: Lint commit messages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so commitlint can lint every commit in the push/PR
          # range, not just the latest one.
          fetch-depth: 0

      # Uses commitlint.config.cjs at the repo root. The action installs
      # commitlint + config-conventional internally; no repo devDependencies
      # needed.
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
